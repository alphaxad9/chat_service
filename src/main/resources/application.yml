# src/main/resources/application.yml

server:
  port: 8005

spring:
  application:
    name: chat_service
  
  # ─────────────────────────────────────────────
  # Multipart file upload configuration
  # ─────────────────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB      # Max size per individual file upload
      max-request-size: 15MB   # Max size for entire multipart request (files + form fields)
      file-size-threshold: 2KB # Files larger than this are written to disk immediately
  
  datasource:
    url: jdbc:postgresql://localhost:5432/chatdb1
    username: ishimwe
    password: "2025New+"
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    root: INFO
    com.example.chat_service: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Auth configuration (clean, structured)
auth:
  public-key-url: http://127.0.0.1:8000/zedvye_one/users/public_key/
  public-key-ttl: 300
  service-url: http://127.0.0.1:8000/zedvye_one
  internal-api-key: super-secret-internal-key-change-in-prod