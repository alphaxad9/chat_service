server:
  port: ${SERVER_PORT:8005}

spring:
  application:
    name: chat-service
  
  # PostgreSQL DataSource
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chatdb1}
    username: ${DB_USERNAME:ishimwe}
    password: ${DB_PASSWORD:2025New+}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
  
  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Enable UUID support
        jdbc:
          lob:
            non_contextual_creation: true
    
  # Flyway (if using explicit migrations instead of auto-DDL)
  # flyway:
  #   enabled: true
  #   locations: classpath:db/migration
  #   baseline-on-migrate: true

# Logging for debugging
logging:
  level:
    com.example.chat_service: ${LOG_LEVEL_APP:DEBUG}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:DEBUG}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOG_LEVEL_TRACE:TRACE}